<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            height: 400px;
            width: 400px;
            background-color: aqua;
            border: 3px solid black;
        }
        .box2{
            height: 400px;
            width: 400px;
            background-color: aqua;
            border: 3px solid black;
        }
        .box3{
            height: 400px;
            width: 400px;
            background-color: pink;
            border: 3px solid black;
        }
        /*Inspect Cntrl+shift+M  */
        @media (min-width:500px) {/*While sqwzzing ,when size becomes greater than 500px, the color will change to green*/
            .box1{
                background-color: green;
            }
        }
        @media (max-width:500px) {/*While sqwzzing ,when size becomes less than 500px, the color will change to green*/
            .box2{
                background-color: green;
            }
        }
        @media(min-width:300px) and (max-width:500px) {/*While sqwzzing ,when size becomes less than 500px, the color will change to green*/
            .box3{
                background-color: blue;
            }
        }
    </style>
</head>


<body>
    <div class="box1">
        Hello jee
    </div>
    <div class="box2">
        This is box2
    </div>
    <div class="box3">
        This is box3
    </div>
</body>
</html>
