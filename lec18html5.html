<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            font-size: 10px;
        }
        .box{
            font-size: 10em; /*It will multiply into the provided font size of parent,or multiply to the default size of 16px*/  
        }
        .firstPara{
            border: 1px solid black;
            font-size: 5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        Div
        <div class="box">
            Welcome , my size will increase as you set font-size of container 
        </div>
    </div>
    <div class="firstPara">
        Hello I m teaching you about rem unit, my size will be Xrem which is equal to X*16px
    </div>
</body>
</html>
