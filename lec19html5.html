<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid black;
            background-color: blueviolet;
            overflow:auto;
        }
        .item{
            width: 200px;
            height:  200px;
            margin: 2px;
            background-color: aquamarine;
            border: 1px solid black;
            float: left;/*By this parent box will collaps ,
            we will see only one line of border at top, 
            the size of  parent box  will change
            overflow: auto,in parent will fix this issue */
        }
        #item1{
            float: right;/* this will put this part to right*/
        }
        #item2{
            float: right;
        }
        #item3{
            float: right;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item" id="item1">A</div>
        <div class="item"id="item2">B</div>
        <div class="item"id="item3">C</div>
    </div>
</body>
</html>
