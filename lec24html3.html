<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:400px;
            width:400px;
            background-color: beige;
            border: 2px solid black;

           /* transition-property:all;Now it will slowly change the color to blue 
            transition-duration: 4s;
            transition-delay:1s;
            transition-timing-function: linear;*/

            /*shorthand notation */
            transition: all 2s ease-in 2s;
            transition: width 2s, height 3s;
        }
        .box:hover{  /*Place the mouse on the block to see the changes */
            width:1200px;
            height: 900px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box">

    </div>
</body>
</html>
