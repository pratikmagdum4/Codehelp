<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid black;
            background-color: blueviolet;
            overflow:auto;
        }
        .item{
            width: 200px;
            height:  200px;
            margin: 2px;
            background-color: aquamarine;
            border: 1px solid black;
            float: left;/*By this parent box will collaps ,
            we will see only one line of border at top, 
            the size of  parent box  will change
            overflow: auto,in parent will fix this issue */
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
