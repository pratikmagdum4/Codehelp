<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: aqua;
            border: 1px solid black;
            width: 50%;/* 50% of its parent, i.e. 50% of body*/
        }
        .child{
            background-color: beige;
            border: 1px solid green;
            width: 50%;/* 50% width of its parent ,i.e. "parent class"*/
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            I m here
        </div>
    </div>
</body>
</html>
