<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{     
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: aqua;
            background-color: #8BC6EC;
            background-image: linear-gradient(135deg, #8BC6EC 0%, #9599E2 50%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .right{
            height: 60%;
            width: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: brown;
        }
        .left{
            height: 60%;
            width: 30%;
            display: flex;
           /* justify-content: center;
            justify-content:space-around;*/
            align-items: center;
            background-color: rgb(94, 13, 169);
            flex-direction: column;
            /*gap: 25px;*/
        }
        .textBox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 75%;
            text-align: center;
        }
        .right img{
            width: 100%;
            height: 100%;
        }
        .staticBox{
            display: flex;
            flex-direction: row;
            justify-content:space-around;
            align-items:flex-end;
        }
        #comments{
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>


    <div class="container">
            <div class="left">
                <div id="textBox">
                    <h1>Get insights that helps your business grow</h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsam numquam nemo dolorum esse sit tenetur quam! Tempore voluptate exercitationem temporibus.</p>
                </div>
                <div class="staticBox">
                    <div id="comments">
                        <h2>10K+</h2>
                        <p>Comments</p>
                    </div>
                    <div id="Users">
                        <h2>214</h2>
                        <p>Paid Users</p>
                    </div>
                    <div id="Views">
                        <h2>12M+</h2>
                        <p>Views</p>
                    </div>
               </div>
            </div> 
            <div class="right">
                <img src="logo.png" alt="">
            </div>
    </div>


</body>
</html>
